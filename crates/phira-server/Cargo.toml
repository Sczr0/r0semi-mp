[package]
name = "phira-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# 二进制输出名 r0semi-mp-server（crate 名保留 phira-*，§4.1 命名定案）
[[bin]]
name = "r0semi-mp-server"
path = "src/main.rs"

[[bin]]
name = "flooder"
path = "src/bin/flooder.rs"

[dependencies]
phira-api = { path = "../phira-api" }
phira-core = { path = "../phira-core" }
impl-rooms-v1 = { path = "../impl-rooms-v1" }
tokio.workspace = true
rand.workspace = true
anyhow.workspace = true
tracing.workspace = true
async-trait.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror.workspace = true
# TLS 回源（§10.3 红线：rustls 单栈可接受；ring provider 纯 Rust 最小内存）
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0"

# systemd 就绪通知（§部署）：服务 bind 成功后 notify systemd（配合 Type=notify）
[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = "0.4"

[dev-dependencies]
# 测试专用：本地 TLS 服务器自签证书生成（§10.3 测试覆盖 TLS 握手路径）
# 证书直接用 rcgen 的 der()，无需 pemfile（2026-08 删：未使用且被 RUSTSEC-2025-0134 标记 unmaintained）
rcgen = "0.13"
# 崩溃猎手 conformance（client-behavior-review §8）：真客户端在用的 SDK（Apache-2.0，
# rev 对齐 C:/git/Phira 游戏客户端 Cargo.toml 锁定）。注意 GPL 的是游戏客户端仓库本体，
# 本 SDK 是独立的 Apache-2.0 协议仓库，dev-dependency 引入无许可证污染。
phira-mp-client = { git = "https://github.com/TeamFlos/phira-mp", rev = "cc822df" }
phira-mp-common = { git = "https://github.com/TeamFlos/phira-mp", rev = "cc822df" }
