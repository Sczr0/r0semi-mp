[package]
name = "phira-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# 二进制输出名 r0semi-mp-server（crate 名保留 phira-*，§4.1 命名定案）
[[bin]]
name = "r0semi-mp-server"
path = "src/main.rs"

[dependencies]
phira-api = { path = "../phira-api" }
phira-core = { path = "../phira-core" }
impl-rooms-v1 = { path = "../impl-rooms-v1" }
tokio.workspace = true
rand.workspace = true
anyhow.workspace = true
tracing.workspace = true
async-trait.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
