[package]
name = "phira-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints.rust]
unsafe_code = "forbid"

# phira-core 是柜台（核心）：不允许 panic 路径（2026-08 决策，后续可拓展到其他 crate）
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
doc_markdown = "allow"

[dependencies]
phira-api = { path = "../phira-api" }
tokio.workspace = true
# server_config.yml 解析（§4.6-4 / §4.9-8）；phira-api 零 serde 红线不受影响（DTO 在本 crate）
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
