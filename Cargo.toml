[workspace]
resolver = "2"
members = [
    "crates/phira-api",
    "crates/phira-contract",
    "crates/phira-core",
    "crates/impl-rooms-v1",
    "crates/phira-server",
]

[workspace.package]
edition = "2024"
# 主许可 AGPL-3.0-only（见 LICENSE）；binary.rs/stream.rs 为 Apache-2.0 移植文件
# （见 LICENSE.Apache-2.0 + NOTICE），包内以文件级 SPDX 头区分
license = "AGPL-3.0-only"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_const_for_fn = "warn"

# 红线：phira-api 只允许 thiserror/half 等轻量库，零 tokio（§4.3-1 / §4.8）
[workspace.dependencies]
thiserror = "2"
half = "2"
async-trait = "0.1"
rand = "0.9"
anyhow = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal", "fs"] }

# 发布构建
[profile.release-dist]
inherits = "release"
strip = "symbols"
lto = "fat"
codegen-units = 1
opt-level = 3
