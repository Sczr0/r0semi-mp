# cargo-deny：第三方依赖许可审查（§4.1 / §5.4 第五道闸门）
[advisories]
yanked = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
# phira-api 只依赖 thiserror/half，许可面必须保持窄小

[bans]
multiple-versions = "warn"

[sources]
allow-git = []
