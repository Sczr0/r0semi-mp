# CI 六道闸门（§5.4 + §5.6）：格式 / lint / 依赖方向 / 测试（含契约测试）/ 许可 / API semver
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 1. Format
        run: cargo fmt --all -- --check

      - name: 2. Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 3. Dependency direction
        run: python3 tools/check-deps.py

      - name: 4. Tests (including contract tests)
        run: cargo test --workspace --all-targets

      - name: 5. Third-party licenses
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: 6. API semver (contract evolution, §5.6)
        # 盯 phira-api 契约 crate：破坏性变更必须走 ADR + 主版本升级（§5.6）。
        # phira-api 未发布 crates.io → baseline 用 git 分支（master）
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: phira-api
          baseline-rev: master

  # 部署产物（§部署）：musl 静态二进制 + nightly release——服务器匿名 curl 下载即跑，
  # 机子上不装 Rust 工具链（docs/deployment.md 迁移清单的构建源）。
  # 构建用 clux/muslrust 容器（自带 musl 工具链，ring 无系统依赖问题；tag 钉死 1.98.0）。
  release:
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build release-dist (musl static, container toolchain)
        # muslrust 容器默认工具链即 x86_64-unknown-linux-musl——不带 --target，
        # 显式指定反而触发容器缺 rust-std（2026-08 CI 实测）
        run: |
          docker run --rm -v "$PWD:/volume" -w /volume             clux/muslrust:1.98.0-stable             cargo build --profile release-dist

      - name: Publish nightly release (服务器匿名下载)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: nightly
          prerelease: true
          make_latest: true
          files: target/release-dist/r0semi-mp-server
