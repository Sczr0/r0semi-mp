# CI 六道闸门（§5.4 + §5.6）：格式 / lint / 依赖方向 / 测试（含契约测试）/ 许可 / API semver
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 1. Format
        run: cargo fmt --all -- --check

      - name: 2. Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 3. Dependency direction
        run: python3 tools/check-deps.py

      - name: 4. Tests (including contract tests)
        run: cargo test --workspace --all-targets

      - name: 5. Third-party licenses
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: 6. API semver (contract evolution, §5.6)
        # 盯 phira-api 契约 crate：破坏性变更必须走 ADR + 主版本升级（§5.6）
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: phira-api
          baseline: main

  # 部署产物（§10 部署/迁移）：Linux release 二进制——机子上不装 Rust 工具链，
  # 下载即跑（docs/deployment.md 迁移清单的构建源）。
  release:
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned by rust-toolchain.toml) + musl target
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl cross toolchain (ring 构建需要 musl-gcc)
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2

      - name: Build release (musl static——任意 Linux 可跑，不挑 glibc 版本)
        run: cargo build --release -p phira-server --target x86_64-unknown-linux-musl

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: r0semi-mp-server-linux
          path: target/x86_64-unknown-linux-musl/release/r0semi-mp-server
          if-no-files-found: error
